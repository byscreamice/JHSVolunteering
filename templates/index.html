<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHS Volunteering</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Welcome to JHS Volunteering</h1>
        <button onclick="document.getElementById('loginModal').showModal()">Admin Sign In</button>
    
    </header>
    <p>This is a simple Flask app for managing volunteering opportunities.</p>
    <dialog id="loginModal">
        <h2>Admin Sign In</h2>
        <form action="/login" method="POST">
            <input type="password" name="password"
            placeholder="Admin Password" required>
        <button class="btn" type="submit">Log In</button>
        </form>
        <button onclick="document.getElementById('loginModal').close()">Close</button>
    </dialog>
    <div class="grid">
    {% for opp in opportunities %}
    <div class="card">
        <h3>{{ opp.title }} - {{ opp.date }}</h3>
        <p>{{ opp.description }}</p>
        <p><a class="btn" href="{{ opp.link }}" target="_blank">Sign Up Link</a></p>
    </div>
    {% endfor %}
    </div>
</body>
</html>
