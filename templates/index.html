<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHS Volunteering</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Welcome to JHS Volunteering</h1>
        <button class="btn btn-elevated" onclick="document.getElementById('loginModal').showModal()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0088FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>Admin Sign In</span>
        </button>
    </header>
    <p>This is a simple Flask app for managing volunteering opportunities.</p>
    <dialog id="loginModal">
        <h2>Admin Sign In</h2>
        <form action="/login" method="POST">
            <input type="password" name="password"
            placeholder="Admin Password" required>
        <button class="btn btn-elevated" type="submit">Log In</button>
        </form>
        <button onclick="document.getElementById('loginModal').close()">Close</button>
    </dialog>
    <div class="grid">
    {% for opp in opportunities %}
    <div class="card">
        <h3>{{ opp.title }} - {{ opp.date }}</h3>
        <p>{{ opp.description }}</p>
        <p><a class="btn" href="{{ opp.link }}" target="_blank">Sign Up Link</a></p>
    </div>
    {% else %}
        <p style="grid-column: 1 / -1; text-align: center; font-size: 1.25rem; color: #4b5563; padding: 40px 0;">No Volunteering Opportunities yet</p>
    {% endfor %}
    </div>
</body>
</html>
